name: Build and cache

on:
  push:
    paths:
      - 'flake.lock'
  workflow_dispatch:
  schedule:
    # Weekly safety net for lock changes that landed by merge rather than a
    # direct push. A no-change run still SUBSTITUTES the whole ~39.6 GiB
    # closure onto the runner (minutes, plus bandwidth) and pushes nothing.
    # Cheap enough to keep, but it is not free — so not a reason to raise
    # the frequency.
    - cron: '43 4 * * 1'

# A second nfu+nrs while the first is still building would start a second
# multi-hour run pushing the same paths. Cancelling the older one is safe:
# pushes are inline (see the timeout comment below), so its completed
# derivations are already in the cache and the newer run substitutes them.
concurrency:
  group: nix-cache
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Deliberate: fail cleanly inside the 6-hour runner cap rather than being
    # killed opaquely. This relies on cachix-action running in *daemon* mode
    # (the default), where Nix's post-build hook pushes each path as it is
    # built, so a timeout keeps everything already banked. If the action ever
    # fell back to store-scan mode that property would be lost silently (only
    # a core.warning in the log) — worth eyeballing the "Cachix:" group of a
    # run to confirm daemon mode.
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v7

      # Must run BEFORE Nix is installed: it repartitions the filesystem to
      # reclaim 65-130 GB, while a default runner has only ~14-20 GB free and
      # this closure is 39.6 GiB.
      - uses: wimpysworld/nothing-but-nix@v10

      - uses: cachix/install-nix-action@v31.11.2

      # authToken comes from the repo secret. If it is missing or empty the
      # action degrades to read-only rather than failing, so a misconfigured
      # secret shows up as push counts of zero in the log, not a red job.
      #
      # extraPullNames: the host substitutes from these two, but the runner
      # otherwise would not — so CI would compile and push paths that are
      # already freely available. Measured against the real closure: 58 of the
      # 657 non-cache.nixos.org paths (1.65 GiB, incl. the big CUDA libs:
      # libcublas 816 MiB, libcufft 277 MiB, cuda_nvrtc 217 MiB) come from
      # these two caches. Pushes still go only to `wiggen`, and substituted
      # paths never trigger the post-build hook, so nothing extra is stored.
      - uses: cachix/cachix-action@v17
        with:
          name: wiggen
          extraPullNames: nix-community,hyprland
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Show disk headroom
        run: df -h /

      - name: Build desktop toplevel
        run: |
          nix build --print-build-logs \
            '.#nixosConfigurations.desktop.config.system.build.toplevel'
